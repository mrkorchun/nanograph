name: Windows CLI Artifact

on:
  push:
    branches:
      - public-windows-artifacts
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-cli:
    name: Build Windows CLI artifact
    runs-on: windows-2022
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "27.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        run: rustup toolchain install 1.94.1 --profile minimal

      - name: Restore cargo cache
        id: cargo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cli-artifact-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            windows-native-cli-release-${{ hashFiles('Cargo.lock') }}
            windows-native-cli-${{ hashFiles('Cargo.lock') }}
            windows-cli-${{ hashFiles('Cargo.lock') }}
            windows-cli-artifact-
            windows-native-cli-
            windows-cli-

      - name: Build CLI
        run: cargo +1.94.1 build -p nanograph-cli --release

      - name: Verify CLI
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'target\release\nanograph.exe'
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "missing Windows CLI: $exe"
          }
          & $exe --version
          if ($LASTEXITCODE -ne 0) {
            throw "nanograph --version failed: $LASTEXITCODE"
          }
          $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $exe
          "$($hash.Hash.ToLowerInvariant())  nanograph.exe" |
            Set-Content -NoNewline -Path "$exe.sha256"

      - name: Upload Windows CLI
        uses: actions/upload-artifact@v4
        with:
          name: nanograph-windows-x64-cli
          path: |
            target/release/nanograph.exe
            target/release/nanograph.exe.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Save cargo cache
        if: always() && steps.cargo-cache.outputs.cache-hit != 'true' && steps.cargo-cache.outputs.cache-primary-key != ''
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
