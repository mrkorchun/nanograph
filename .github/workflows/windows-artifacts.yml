name: Windows Artifacts

on:
  push:
    branches:
      - public-windows-artifacts
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "24"
  NANOGRAPH_CI_TRACE: target/ci-artifacts/windows-artifacts-trace.jsonl

jobs:
  windows-artifacts:
    name: Build release and debug artifacts
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      NPM_CONFIG_CACHE: ${{ github.workspace }}/.npm-cache

    steps:
      - uses: actions/checkout@v4

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "27.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        run: rustup toolchain install 1.94.1 --profile minimal --target x86_64-pc-windows-msvc

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore cargo cache
        id: cargo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-artifacts-cargo-${{ runner.os }}-rust-1.94.1-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            windows-ts-binding-cargo-${{ hashFiles('Cargo.lock') }}
            windows-cli-artifact-${{ hashFiles('Cargo.lock') }}
            windows-native-cli-release-${{ hashFiles('Cargo.lock') }}
            windows-native-cli-${{ hashFiles('Cargo.lock') }}
            npm-x86_64-pc-windows-msvc-${{ hashFiles('Cargo.lock') }}
            windows-artifacts-cargo-${{ runner.os }}-rust-1.94.1-
            windows-ts-binding-cargo-
            windows-cli-artifact-
            windows-native-cli-
            windows-cli-
            npm-x86_64-pc-windows-msvc-

      - name: Restore npm cache
        id: npm-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.NPM_CONFIG_CACHE }}
          key: windows-artifacts-npm-${{ hashFiles('crates/nanograph-ts/package.json', 'package-lock.json') }}
          restore-keys: |
            windows-ts-binding-npm-${{ hashFiles('crates/nanograph-ts/package.json', 'package-lock.json') }}
            windows-artifacts-npm-
            windows-ts-binding-npm-

      - name: Build artifacts
        env:
          CARGO_CACHE_HIT: ${{ steps.cargo-cache.outputs.cache-hit }}
          NPM_CACHE_HIT: ${{ steps.npm-cache.outputs.cache-hit }}
        run: node --experimental-strip-types tools/ci/windows-artifacts.ts all

      - name: Upload release CLI
        uses: actions/upload-artifact@v4
        with:
          name: nanograph-windows-x64-cli-release
          path: target/ci-artifacts/nanograph-windows-x64-cli-release/
          if-no-files-found: error
          retention-days: 14

      - name: Upload release TS native binding
        uses: actions/upload-artifact@v4
        with:
          name: nanograph-ts-win32-x64-msvc-node-release
          path: target/ci-artifacts/nanograph-ts-win32-x64-msvc-node-release/
          if-no-files-found: error
          retention-days: 14

      - name: Upload debug diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nanograph-windows-debug-diagnostics
          path: |
            target/ci-artifacts/nanograph-ts-win32-x64-msvc-node-debug/
            target/ci-artifacts/windows-artifacts-trace.jsonl
          if-no-files-found: warn
          retention-days: 14

      - name: Save cargo cache
        if: always() && steps.cargo-cache.outputs.cache-hit != 'true' && steps.cargo-cache.outputs.cache-primary-key != ''
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

      - name: Save npm cache
        if: always() && steps.npm-cache.outputs.cache-hit != 'true' && steps.npm-cache.outputs.cache-primary-key != ''
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ env.NPM_CONFIG_CACHE }}
          key: ${{ steps.npm-cache.outputs.cache-primary-key }}
